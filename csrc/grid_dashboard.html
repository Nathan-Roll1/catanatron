<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Catanatron Grid Search</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #c9d1d9; font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; }
.header { padding: 16px 24px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; }
.stats { display: flex; gap: 28px; }
.stat .val { font-size: 22px; font-weight: 700; color: #f0f6fc; }
.stat .lbl { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
.chart-wrap { padding: 24px; height: calc(100vh - 70px); }
canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="header">
    <h1 id="title">Grid Search</h1>
    <div class="stats">
        <div class="stat"><div class="val" id="sProgress">0/100</div><div class="lbl">Points</div></div>
        <div class="stat"><div class="val" id="sGames">0</div><div class="lbl">Games</div></div>
        <div class="stat"><div class="val" id="sGps">0</div><div class="lbl">Games/sec</div></div>
        <div class="stat"><div class="val" id="sBestWr">25.0%</div><div class="lbl">Best WR</div></div>
        <div class="stat"><div class="val" id="sBestVal">--</div><div class="lbl">Best Value</div></div>
    </div>
</div>
<div class="chart-wrap"><canvas id="chart"></canvas></div>
<script>
let header = null;
let points = [];
let lastLen = 0;

function fetchData() {
    fetch('/data?' + Date.now()).then(r => r.text()).then(text => {
        const lines = text.trim().split('\n').filter(l => l.length > 0);
        if (lines.length <= lastLen) return;
        lastLen = lines.length;
        header = null; points = [];
        for (const line of lines) {
            try {
                const d = JSON.parse(line);
                if (d.param) header = d;
                else if (d.pt !== undefined) points.push(d);
            } catch(e) {}
        }
        render();
    }).catch(() => {});
}

function render() {
    if (!header || points.length === 0) return;
    document.getElementById('title').textContent = 'Grid Search: ' + header.param;
    const last = points[points.length - 1];
    document.getElementById('sProgress').textContent = points.length + '/' + header.points.length || 100;
    document.getElementById('sGames').textContent = (last.games/1000).toFixed(0) + 'k';
    document.getElementById('sGps').textContent = last.gps.toFixed(0);

    let bestWr = 25, bestVal = header.orig, bestPct = 0;
    for (const p of points) {
        if (p.wr > bestWr) { bestWr = p.wr; bestVal = p.val; bestPct = p.pct; }
    }
    document.getElementById('sBestWr').textContent = bestWr.toFixed(1) + '%';
    document.getElementById('sBestVal').textContent = bestPct.toFixed(2) + '%';

    drawChart();
}

function drawChart() {
    const c = document.getElementById('chart');
    const rect = c.parentElement.getBoundingClientRect();
    const w = rect.width - 8, h = rect.height - 8;
    c.width = w * 2; c.height = h * 2;
    c.style.width = w + 'px'; c.style.height = h + 'px';
    const ctx = c.getContext('2d');
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, w, h);

    const margin = { l: 60, r: 30, t: 20, b: 40 };
    const pw = w - margin.l - margin.r, ph = h - margin.t - margin.b;

    /* Compute Y range */
    let minWr = 23, maxWr = 27;
    for (const p of points) {
        if (p.wr < minWr) minWr = p.wr - 0.5;
        if (p.wr > maxWr) maxWr = p.wr + 0.5;
    }
    minWr = Math.floor(minWr); maxWr = Math.ceil(maxWr);

    /* X range from header */
    const xMin = points[0].pct, xMax = points[points.length-1].pct;
    const xRange = xMax - xMin || 1;

    /* Grid lines */
    ctx.strokeStyle = '#21262d'; ctx.lineWidth = 0.5;
    ctx.fillStyle = '#484f58'; ctx.font = '10px monospace';
    for (let y = minWr; y <= maxWr; y += 1) {
        const py = margin.t + ph - (y - minWr) / (maxWr - minWr) * ph;
        ctx.beginPath(); ctx.moveTo(margin.l, py); ctx.lineTo(w - margin.r, py); ctx.stroke();
        ctx.textAlign = 'right';
        ctx.fillText(y.toFixed(0) + '%', margin.l - 6, py + 4);
    }

    /* X axis labels */
    ctx.textAlign = 'center';
    for (let i = 0; i < points.length; i += Math.max(1, Math.floor(points.length / 10))) {
        const px = margin.l + (points[i].pct - xMin) / xRange * pw;
        ctx.fillText(points[i].pct.toFixed(1) + '%', px, h - margin.b + 18);
    }
    ctx.fillStyle = '#8b949e'; ctx.font = '11px monospace';
    ctx.fillText('Parameter change from baseline', margin.l + pw / 2, h - 4);

    /* 25% baseline */
    const bl = margin.t + ph - (25 - minWr) / (maxWr - minWr) * ph;
    ctx.strokeStyle = '#f85149'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(margin.l, bl); ctx.lineTo(w - margin.r, bl); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#f85149'; ctx.textAlign = 'left'; ctx.font = '10px monospace';
    ctx.fillText('25% baseline', w - margin.r - 80, bl - 6);

    /* Original value vertical line */
    const origX = margin.l + (0 - xMin) / xRange * pw;
    ctx.strokeStyle = '#484f58'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(origX, margin.t); ctx.lineTo(origX, h - margin.b); ctx.stroke();
    ctx.setLineDash([]);

    /* Error bars (95% CI) */
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2;
    for (const p of points) {
        const ci = p.ci95 || 0;
        const px = margin.l + (p.pct - xMin) / xRange * pw;
        const pyTop = margin.t + ph - (Math.min(maxWr, p.wr + ci) - minWr) / (maxWr - minWr) * ph;
        const pyBot = margin.t + ph - (Math.max(minWr, p.wr - ci) - minWr) / (maxWr - minWr) * ph;
        ctx.beginPath(); ctx.moveTo(px, pyTop); ctx.lineTo(px, pyBot); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px - 4, pyTop); ctx.lineTo(px + 4, pyTop); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px - 4, pyBot); ctx.lineTo(px + 4, pyBot); ctx.stroke();
    }

    /* Data points */
    ctx.fillStyle = '#58a6ff';
    for (const p of points) {
        const px = margin.l + (p.pct - xMin) / xRange * pw;
        const py = margin.t + ph - (p.wr - minWr) / (maxWr - minWr) * ph;
        ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
    }

    /* Connect with line */
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.4;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
        const px = margin.l + (points[i].pct - xMin) / xRange * pw;
        const py = margin.t + ph - (points[i].wr - minWr) / (maxWr - minWr) * ph;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* Highlight best point */
    let bestPt = points[0];
    for (const p of points) if (p.wr > bestPt.wr) bestPt = p;
    const bx = margin.l + (bestPt.pct - xMin) / xRange * pw;
    const by = margin.t + ph - (bestPt.wr - minWr) / (maxWr - minWr) * ph;
    ctx.strokeStyle = '#7ee787'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#7ee787'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    const bci = bestPt.ci95 ? ' +/-' + bestPt.ci95.toFixed(2) : '';
    ctx.fillText(bestPt.wr.toFixed(2) + '%' + bci + ' @ ' + bestPt.pct.toFixed(3) + '%', bx + 10, by - 4);
}

setInterval(fetchData, 1000);
fetchData();
</script>
</body>
</html>
